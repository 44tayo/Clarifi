<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Google Calendar">
  <defs>
    <clipPath id="gcal-round">
      <rect x="2" y="2" width="44" height="44" rx="10"/>
    </clipPath>
  </defs>
  <g clip-path="url(#gcal-round)">
    <!-- Outer frame -->
    <rect x="2" y="2" width="44" height="44" fill="#1a73e8"/>
    <rect x="36" y="2" width="10" height="44" fill="#fbbc04"/>
    <rect x="2" y="36" width="44" height="10" fill="#34a853"/>
    <path d="M36 36h10v10H36z" fill="#ea4335"/>
    <!-- Inner dark face -->
    <rect x="8" y="10" width="28" height="26" rx="3" fill="#0b0b0b"/>
    <!-- Day -->
    <text
      x="22"
      y="29.5"
      text-anchor="middle"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
      font-size="17"
      font-weight="700"
      fill="#4285f4"
    >31</text>
  </g>
</svg>
