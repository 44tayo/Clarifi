name: Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'web/**'
      - '**.md'
  workflow_dispatch:

env:
  NODE_VERSION: 22
  SKIP_NATIVE_REBUILD: '1'

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import code signing certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN_PATH"

      - name: Build signed macOS release
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: true
        run: npm run build:mac

      - name: Build unsigned macOS artifacts (no signing secrets)
        if: env.BUILD_CERTIFICATE_BASE64 == ''
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SKIP_NOTARIZE: '1'
          SKIP_NATIVE_REBUILD: ''
        run: MAC_CI_ARCH=arm64 bash scripts/build-mac-ci.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: clarifi-macos-dmg
          path: release/*.dmg
          if-no-files-found: error

  build-win:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Rebuild native modules for Electron
        run: npx --yes @electron/rebuild -f -w better-sqlite3,keytar

      - name: Build Windows native module
        run: npm run build:native:win

      - name: Build frontend
        run: npx tsc --noEmit && npm run build

      - name: Package Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --win --x64

      - name: Upload Windows build debug log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: win-build-debug-log
          path: |
            .cursor/debug-6989d7.log
            .cursor/win-native-build.log
          if-no-files-found: ignore

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: clarifi-windows-exe
          path: release/*.exe
          if-no-files-found: error

  publish-release:
    needs: [build-mac, build-win]
    if: always() && needs.build-mac.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          name: clarifi-macos-dmg
          path: release-assets

      - name: Download Windows installer
        if: needs.build-win.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: clarifi-windows-exe
          path: release-assets

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Clarifi 0.1.0
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          files: release-assets/**
          generate_release_notes: true

      - name: Verify release DMG URLs
        run: |
          node scripts/verify-download-artifact.mjs \
            "https://github.com/Tayowill/clarificluely/releases/download/v0.1.0/Clarifi-0.1.0-arm64.dmg" \
            50000000 || true
